# Three model servers — LLM, embeddings, reranker — from ONE image
# (dlabssg/local-llm:latest), differentiated purely by the `command:` flags
# below. This is deliberately the same shape as OpsGPT's own compose file: one
# llama.cpp image, run three times with different model files and pooling
# modes. See README.md for what to hand the client and how they configure it.
#
# AIR-GAP: nothing here ever pulls a model over the network. Each service reads
# a GGUF file the client places under ./models (bind-mounted read-only) and
# never uses llama.cpp's --hf-repo download path. `docker compose pull` needs
# the registry once (or `docker load` from a tar, see README); after that,
# `docker compose up` needs nothing.
#
# NUMA: when NUMA_ENABLED=1 in .env, the entrypoint wrapper runs llama-server
# under `numactl --interleave=all`. Combined with cpuset pinning and
# --numa distribute, this matches OpsGPT's production tuning for multi-socket
# boxes (benchmarked ~50% faster decode on dual-socket Xeon).
#
# GPU: for GPU-equipped clients, use the cuda image and the "gpu" profile:
#   LOCAL_LLM_IMAGE=dlabssg/local-llm:cuda12
#   docker compose --profile gpu up -d
# See .env.example for GPU_LAYERS and GPU_COUNT settings.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ── LLM (chat / completion) ────────────────────────────────────────────────
  llm:
    image: ${LOCAL_LLM_IMAGE:-dlabssg/local-llm:latest}
    container_name: local-llm-llm
    restart: unless-stopped
    mem_limit: ${LLM_MEM_LIMIT:-16g}
    oom_score_adj: -300    # primary chat model — protect under memory pressure
    logging: *default-logging
    # SYS_NICE is needed for numactl's memory-policy syscall. Harmless if
    # NUMA_ENABLED=0 — the entrypoint just skips numactl entirely.
    cap_add:
      - SYS_NICE
    environment:
      - NUMA_ENABLED=${NUMA_ENABLED:-0}
    volumes:
      - ./models:/models:ro
    command:
      - "--model"
      - "/models/${LLM_MODEL_FILE:?set LLM_MODEL_FILE in .env to the GGUF filename under ./models}"
      - "--alias"
      - "${LLM_MODEL_NAME:-llm}"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "--ctx-size"
      - "${LLM_CTX:-8192}"
      - "--threads"
      - "${LLM_THREADS:-8}"
      # 1 = the full context goes to a single request rather than being split
      # into N parallel slots. Right for a single client app calling this
      # server; raise --parallel and lower ctx-size per slot for concurrent
      # multi-user traffic instead.
      - "--parallel"
      - "${LLM_PARALLEL:-1}"
      - "--cont-batching"
      - "--cache-ram"
      - "0"
      # NUMA distribute: tell llama.cpp to spread work across NUMA nodes.
      # Safe to pass even on single-socket boxes (llama.cpp auto-detects).
      - "--numa"
      - "${NUMA_MODE:-distribute}"
      - "--metrics"
    # Pin to specific CPU cores for NUMA-local memory access. Empty = no
    # pinning (default). Example: "0-19" for one 20-core NUMA node.
    cpuset: ${LLM_CPUSET:-}
    ports:
      - "${LLM_PORT:-8097}:8080"
    networks: [modelnet]

  # ── Embeddings ──────────────────────────────────────────────────────────────
  embed:
    image: ${LOCAL_LLM_IMAGE:-dlabssg/local-llm:latest}
    container_name: local-llm-embed
    restart: unless-stopped
    mem_limit: ${EMBED_MEM_LIMIT:-3g}
    oom_score_adj: 200     # less critical than LLM — sacrifice before chat model
    logging: *default-logging
    cap_add:
      - SYS_NICE
    environment:
      - NUMA_ENABLED=${NUMA_ENABLED:-0}
    volumes:
      - ./models:/models:ro
    command:
      - "--model"
      - "/models/${EMBED_MODEL_FILE:?set EMBED_MODEL_FILE in .env to the GGUF filename under ./models}"
      - "--alias"
      - "${EMBED_MODEL_NAME:-embed}"
      - "--embeddings"
      # Pooling mode is MODEL-SPECIFIC, not a free choice: BGE-M3 and
      # nomic-embed use "mean", BGE-large-en-v1.5 uses "cls". Get this wrong and
      # the server still answers — it just returns poor-quality vectors, which
      # is a silent failure. See README.md "Choosing --pooling".
      - "--pooling"
      - "${EMBED_POOLING:-mean}"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "--ctx-size"
      - "${EMBED_CTX:-4096}"
      # Physical batch must be >= the largest chunk's token count, or embedding
      # a long chunk fails with "input too large to process". Keep this >= ctx.
      - "--batch-size"
      - "${EMBED_CTX:-4096}"
      - "--ubatch-size"
      - "${EMBED_CTX:-4096}"
      - "--threads"
      - "${EMBED_THREADS:-4}"
      - "--numa"
      - "${NUMA_MODE:-distribute}"
      - "--metrics"
    cpuset: ${EMBED_CPUSET:-}
    ports:
      - "${EMBED_PORT:-8098}:8080"
    networks: [modelnet]

  # ── Reranker (cross-encoder) ────────────────────────────────────────────────
  reranker:
    image: ${LOCAL_LLM_IMAGE:-dlabssg/local-llm:latest}
    container_name: local-llm-reranker
    restart: unless-stopped
    mem_limit: ${RERANK_MEM_LIMIT:-3g}
    oom_score_adj: 200     # less critical than LLM — sacrifice before chat model
    logging: *default-logging
    cap_add:
      - SYS_NICE
    environment:
      - NUMA_ENABLED=${NUMA_ENABLED:-0}
    volumes:
      - ./models:/models:ro
    command:
      - "--model"
      - "/models/${RERANK_MODEL_FILE:?set RERANK_MODEL_FILE in .env to the GGUF filename under ./models}"
      - "--alias"
      - "${RERANK_MODEL_NAME:-reranker}"
      - "--reranking"
      # Reranking always uses "rank" pooling — unlike --pooling above, this one
      # is not a per-model choice.
      - "--pooling"
      - "rank"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "--ctx-size"
      - "${RERANK_CTX:-4096}"
      # Physical batch must be >= the largest (query + passage) token count
      # combined, or a long pair fails with "input too large to process".
      - "--batch-size"
      - "${RERANK_CTX:-4096}"
      - "--ubatch-size"
      - "${RERANK_CTX:-4096}"
      - "--threads"
      - "${RERANK_THREADS:-4}"
      - "--numa"
      - "${NUMA_MODE:-distribute}"
      - "--metrics"
    cpuset: ${RERANK_CPUSET:-}
    ports:
      - "${RERANK_PORT:-8099}:8080"
    networks: [modelnet]

  # ── GPU variants (only start with: docker compose --profile gpu up -d) ─────
  # These mirror the CPU services above but add NVIDIA GPU device reservations
  # and the --n-gpu-layers flag. They replace the CPU services (same ports).
  #
  # Usage:
  #   1. Set LOCAL_LLM_IMAGE=dlabssg/local-llm:cuda12 in .env
  #   2. docker compose --profile gpu up -d

  llm-gpu:
    image: ${LOCAL_LLM_IMAGE:-dlabssg/local-llm:cuda12}
    container_name: local-llm-llm-gpu
    profiles: ["gpu"]
    restart: unless-stopped
    mem_limit: ${LLM_MEM_LIMIT:-16g}
    oom_score_adj: -300
    logging: *default-logging
    cap_add:
      - SYS_NICE
    environment:
      - NUMA_ENABLED=${NUMA_ENABLED:-0}
    volumes:
      - ./models:/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${GPU_COUNT:-all}
              capabilities: [gpu]
    command:
      - "--model"
      - "/models/${LLM_MODEL_FILE:?set LLM_MODEL_FILE in .env}"
      - "--alias"
      - "${LLM_MODEL_NAME:-llm}"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "--ctx-size"
      - "${LLM_CTX:-8192}"
      - "--threads"
      - "${LLM_THREADS:-8}"
      - "--n-gpu-layers"
      - "${LLM_GPU_LAYERS:-99}"
      - "--parallel"
      - "${LLM_PARALLEL:-1}"
      - "--cont-batching"
      - "--cache-ram"
      - "0"
      - "--numa"
      - "${NUMA_MODE:-distribute}"
      - "--metrics"
    cpuset: ${LLM_CPUSET:-}
    ports:
      - "${LLM_PORT:-8097}:8080"
    networks: [modelnet]

  embed-gpu:
    image: ${LOCAL_LLM_IMAGE:-dlabssg/local-llm:cuda12}
    container_name: local-llm-embed-gpu
    profiles: ["gpu"]
    restart: unless-stopped
    mem_limit: ${EMBED_MEM_LIMIT:-3g}
    oom_score_adj: 200
    logging: *default-logging
    cap_add:
      - SYS_NICE
    environment:
      - NUMA_ENABLED=${NUMA_ENABLED:-0}
    volumes:
      - ./models:/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${GPU_COUNT:-all}
              capabilities: [gpu]
    command:
      - "--model"
      - "/models/${EMBED_MODEL_FILE:?set EMBED_MODEL_FILE in .env}"
      - "--alias"
      - "${EMBED_MODEL_NAME:-embed}"
      - "--embeddings"
      - "--pooling"
      - "${EMBED_POOLING:-mean}"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "--ctx-size"
      - "${EMBED_CTX:-4096}"
      - "--batch-size"
      - "${EMBED_CTX:-4096}"
      - "--ubatch-size"
      - "${EMBED_CTX:-4096}"
      - "--threads"
      - "${EMBED_THREADS:-4}"
      - "--n-gpu-layers"
      - "${EMBED_GPU_LAYERS:-99}"
      - "--numa"
      - "${NUMA_MODE:-distribute}"
      - "--metrics"
    cpuset: ${EMBED_CPUSET:-}
    ports:
      - "${EMBED_PORT:-8098}:8080"
    networks: [modelnet]

  reranker-gpu:
    image: ${LOCAL_LLM_IMAGE:-dlabssg/local-llm:cuda12}
    container_name: local-llm-reranker-gpu
    profiles: ["gpu"]
    restart: unless-stopped
    mem_limit: ${RERANK_MEM_LIMIT:-3g}
    oom_score_adj: 200
    logging: *default-logging
    cap_add:
      - SYS_NICE
    environment:
      - NUMA_ENABLED=${NUMA_ENABLED:-0}
    volumes:
      - ./models:/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${GPU_COUNT:-all}
              capabilities: [gpu]
    command:
      - "--model"
      - "/models/${RERANK_MODEL_FILE:?set RERANK_MODEL_FILE in .env}"
      - "--alias"
      - "${RERANK_MODEL_NAME:-reranker}"
      - "--reranking"
      - "--pooling"
      - "rank"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "--ctx-size"
      - "${RERANK_CTX:-4096}"
      - "--batch-size"
      - "${RERANK_CTX:-4096}"
      - "--ubatch-size"
      - "${RERANK_CTX:-4096}"
      - "--threads"
      - "${RERANK_THREADS:-4}"
      - "--n-gpu-layers"
      - "${RERANK_GPU_LAYERS:-99}"
      - "--numa"
      - "${NUMA_MODE:-distribute}"
      - "--metrics"
    cpuset: ${RERANK_CPUSET:-}
    ports:
      - "${RERANK_PORT:-8099}:8080"
    networks: [modelnet]

networks:
  modelnet:
    driver: bridge
